<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilib++</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="icond.png" type="png">
</head>
<body>
    <div class="crt-effect">
        <header class="retro-border">
            <div class="container">
                <div class="header-top">
                    <h1 class="retro-text">> Utilib<span class="blink">_</span></h1>
                    <div class="theme-switch">
                        <label class="retro-switch">
                            <input type="checkbox" id="theme-toggle">
                            <span class="slider"></span>
                        </label>
                        <span class="theme-label">DARK</span>
                    </div>
                </div>
                <nav class="terminal-nav">
                    <button class="retro-btn active" data-page="home">Главная</button>
                    <button class="retro-btn" data-page="chat">Чат</button>
                    <button class="retro-btn" data-page="docs">Документация</button>
                </nav>
            </div>
        </header>

        <main class="container" id="content-area">
            <!-- Контент будет загружаться динамически -->
        </main>

        <footer class="retro-border">
            <div class="container">
                <p class="retro-text">© 2023 Utilib Project | <img src="images/icond.png" alt="icon" class="footer-icon"></p>
            </div>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
